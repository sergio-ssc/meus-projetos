<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>

    <style>
        body{
            background-color: rgb(160, 92, 160);
            max-width: 400px;
            margin: auto;
            font-family: Arial, Helvetica, sans-serif;

            h1{
                text-align: center;
                color: white;
            }

            input{
                height: 40px;
                width: 78%;
                border: solid 2px rgb(88, 4, 88);
                background-color: rgb(234, 234, 234);
                outline: none;
            }

            button{
                height: 38px;
                border: none;
                background-color: blueviolet;
                color: white;
                cursor: pointer;
                border-radius: 5px;
                transition: 0.3s;
                font-weight: bold;
            }

            button:hover{
                    background-color: rgb(74, 6, 85);
                    height: 45px;
                }

            ul{
                list-style: none;
                padding: 0;
            }

            li{
                background-color: bisque;
                padding: 10px;
                margin: 10px auto;
                border-radius: 5px;
                display: flex;
                justify-content: space-between;
                font-weight: bold;

                span{
                    cursor: pointer;
                    color: red;
                }
            }
        }
    </style>
</head>
<body>
    <h1>Minha lista de tarefas</h1>
    <input type="text" placeholder="Adicione a sua tarefa!"> <button onclick="AdicionarTarefa()">Adicionar</button>
    <ul>
    </ul>



    <script src="script.js"></script>
</body>
</html>
